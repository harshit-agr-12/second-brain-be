name: Deploy Backend to EC2

on:
  push:
    branches:
      - main   # 🔧 CHANGE if your deployment branch is different

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}          # 🔧 YOUR EC2 PUBLIC IP / DOMAIN
          username: ubuntu                       # 🔧 CHANGE if EC2 user is not "ubuntu"
          key: ${{ secrets.EC2_SSH_KEY }}        # 🔧 YOUR PRIVATE SSH KEY
          port: 22                               # 🔧 Change only if SSH port is different

          script: |
            set -e

            echo "🚀 Starting deployment..."

            # 🔧🔧🔧 CHANGE THIS PATH TO YOUR ACTUAL BACKEND FOLDER ON EC2
            cd /home/ubuntu/backend

            echo "📦 Fetching latest code..."
            git fetch origin

            echo "🔄 Resetting to latest main branch..."
            git reset --hard origin/main          # 🔧 Change branch if not main

            echo "📥 Installing dependencies..."
            pnpm install
            pnpm build

            echo "♻️ Restarting PM2 process..."
            pm2 restart backend                   # 🔧 CHANGE to your PM2 app name

            echo "✅ Deployment completed successfully"
